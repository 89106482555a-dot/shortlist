<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>EventLab: в календарь</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2EBDD;color:#15110F;font:17px/1.45 -apple-system,'Helvetica Neue',Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
main{max-width:340px}
h1{font-size:26px;font-weight:600;margin:0 0 8px}
p{margin:0 0 20px;color:#5E5548}
button{display:block;width:100%;padding:15px 20px;border:0;border-radius:99px;background:#C81E2E;color:#fff;font:600 17px -apple-system,'Helvetica Neue',Arial,sans-serif}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
  <h1 id="t">Добавить в календарь</h1>
  <p id="x">Готовлю файл…</p>
  <button id="go" disabled>Открыть календарь</button>
</main>
<script>
(function(){
  var go=document.getElementById('go'),t=document.getElementById('t'),x=document.getElementById('x'),raw=location.hash.slice(1),text='',CACHE='shotlist-cal';
  function fail(a,b){t.textContent=a;x.textContent=b;go.style.display='none'}
  try{text=decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/'))))}catch(e){}
  if(text.indexOf('BEGIN:VCALENDAR')!==0){fail('Не удалось открыть календарь','Вернись в EventLab и нажми кнопку календаря ещё раз.');return}
  var n=(text.match(/BEGIN:VEVENT/g)||[]).length;
  t.textContent=n===1?'Добавить проект в календарь':'Добавить проекты в календарь: '+n;
  if(!('serviceWorker' in navigator)||!('caches' in window)){fail('Этот браузер не подходит','Открой ссылку в Safari.');return}
  function open(){location.href='event.ics?t='+Date.now()}
  go.onclick=open;
  caches.open(CACHE).then(function(c){
    return c.put('event.ics',new Response(text,{headers:{'Content-Type':'text/calendar; charset=utf-8'}}))
  }).then(function(){
    return navigator.serviceWorker.register('sw.js',{updateViaCache:'none'})
  }).then(function(){
    return navigator.serviceWorker.ready
  }).then(function(){
    go.disabled=false;x.textContent='Нажми кнопку, затем «Добавить все».';open()
  }).catch(function(){fail('Не удалось подготовить файл','Вернись в EventLab и нажми кнопку календаря ещё раз.')});
})();
</script>
</body>
</html>
